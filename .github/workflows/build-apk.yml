name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk orbit-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: orbit-${{ github.run_number }}.apk

      # A prerelease per build, so the APK can be downloaded straight from a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbit build ${{ github.run_number }}
          prerelease: true
          files: orbit-${{ github.run_number }}.apk
          body: |
            Debug build from ${{ github.sha }}.
            Install: download the APK on your phone, open it, and allow installs from your browser or file manager if asked.
