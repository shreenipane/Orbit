name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner ships the Android SDK; point Gradle at it and accept licences.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      # Optional: a permanent signing key from repository secrets, so every build installs over the last one.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit.jks" >> "$GITHUB_ENV"
          fi

      # Release build: not debuggable.
      - name: Build APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk orbit-${{ github.run_number }}.apk

      # Optional smaller build (R8 shrinking). If it fails, the normal APK above still ships.
      - name: Build small APK
        continue-on-error: true
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleSmall
          cp app/build/outputs/apk/small/app-small.apk orbit-${{ github.run_number }}-small.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: orbit-${{ github.run_number }}*.apk

      # A prerelease per build, so the APK can be downloaded straight from a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbit build ${{ github.run_number }}
          prerelease: true
          files: orbit-${{ github.run_number }}*.apk
          body: |
            Release build from ${{ github.sha }}.
            orbit-N.apk is the normal build. orbit-N-small.apk (if present) is the same app shrunk with R8; try it before relying on it.
            Install: download the APK on your phone, open it, and allow installs from your browser or file manager if asked.
